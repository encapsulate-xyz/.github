name: Dependabot Auto-Merge

on:
  workflow_dispatch:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: automerge-dependabot

jobs:
  dependabot:
    environment: automerge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PK }}
          owner: ${{ github.repository_owner }}

      - name: Approve and Auto-merge PRs
        id: merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o pipefail

          # Define the repositories to track
          REPOS=(
            "encapsulate-xyz/sui-rgp-ui"
            "encapsulate-xyz/sui-rgp-autopilot"
            "encapsulate-xyz/titanium"
            "encapsulate-xyz/solana-graph-viz"
            "encapsulate-xyz/api-server"
            "encapsulate-xyz/aptos-network-viz"
            "encapsulate-xyz/cosmos-bots"
            "encapsulate-xyz/askeladd"
            "encapsulate-xyz/iota-sweep-script"
            "encapsulate-xyz/pharos-staking-hub"
          )

          # Every failure is recorded here and the loop goes on, so one broken repo or PR never stops the others;
          # the issue step below turns this file into the run's issue.
          mkdir -p out
          : > out/errors.md

          for REPO in "${REPOS[@]}"; do
            echo "========================================"
            echo "Checking repository: $REPO"

            # 1. Fetch all open PR numbers created by Dependabot for the repository, sorting oldest to newest
            if ! PR_LIST=$(gh pr list --repo "$REPO" --author "app/dependabot" --state open --json number --jq 'reverse | .[].number' 2>out/err.txt); then
              echo "::error::Failed to fetch PRs for $REPO"
              echo "- **$REPO**: could not list its PRs (is the GitHub App installed with access?): \`$(head -c 300 out/err.txt | tr '\n' ' ')\`" >> out/errors.md
              continue
            fi

            if [ -z "$PR_LIST" ]; then
              echo "No open Dependabot PRs found in $REPO. Skipping."
              continue
            fi

            # 2. Loop through each PR number
            for PR in $PR_LIST; do
              echo "Processing Dependabot PR #$PR in $REPO..."

              # Approve the PR
              if ! gh pr review "$PR" --repo "$REPO" --approve 2>out/err.txt; then
                echo "::error::Failed to approve $REPO#$PR"
                echo "- **$REPO#$PR**: approve failed: \`$(head -c 300 out/err.txt | tr '\n' ' ')\`" >> out/errors.md
                continue
              fi

              # Merge the PR
              if ! gh pr merge "$PR" --repo "$REPO" --squash --admin 2>out/err.txt; then
                echo "::error::Failed to merge $REPO#$PR"
                echo "- **$REPO#$PR**: merge failed: \`$(head -c 300 out/err.txt | tr '\n' ' ')\`" >> out/errors.md
              fi
            done
          done

          [ ! -s out/errors.md ]

      - name: The run's issue
        # one issue per failure, left open until someone closes it; the same failures still open are not opened again
        if: ${{ !cancelled() && (steps.merge.outcome == 'failure' || job.status == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          mkdir -p out
          if [ -s out/errors.md ]; then
            # the fingerprint is which repo/PR failed at which step, not the error text, so a repeat matches
            DIGEST=$(sed -E 's/: `.*$//' out/errors.md | sort | sha1sum | cut -c1-12)
            COUNT=$(wc -l < out/errors.md)
            { echo "### Errors"; echo; cat out/errors.md; } > out/issue.md
            TITLE="Dependabot Auto-Merge · $(date -u +%F) · $COUNT errors"
          else
            DIGEST=$(echo "the run failed before its report" | sha1sum | cut -c1-12)
            echo "A step stopped before the merge loop could report: the run's log has the error." > out/issue.md
            TITLE="Dependabot Auto-Merge · $(date -u +%F) · the run failed"
          fi
          printf '\n\n_Run: %s_\n\n<!-- digest:%s -->\n' "$RUN_URL" "$DIGEST" >> out/issue.md

          SAME=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label failed --limit 100 --json url,title,body \
            --jq "[.[] | select((.title | startswith(\"Dependabot Auto-Merge ·\")) and (.body | contains(\"digest:$DIGEST\")))][0].url // empty")
          if [ -n "$SAME" ]; then
            echo "$SAME: still open and unchanged — no new issue"
            exit 0
          fi

          gh label create failed --repo "$GITHUB_REPOSITORY" --force --color D73A4A \
            --description "A job errored or stopped: the run failed" >/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file out/issue.md --label failed

      - name: The job failed
        if: steps.merge.outcome == 'failure'
        run: exit 1
