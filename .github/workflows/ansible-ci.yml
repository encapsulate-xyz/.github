name: Ansible CI

# Shared checks for the Ansible repos. A repo runs them with:
#   jobs:
#     ansible:
#       uses: encapsulate-xyz/.github/.github/workflows/ansible-ci.yml@main
# The molecule job runs only in repos with Molecule scenarios; see ansible-ci/README.md.
on:
  workflow_call:
    inputs:
      ci-ref:
        description: Branch of encapsulate-xyz/.github to take the ansible-ci tools from
        type: string
        default: main

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible==11.13.0 ansible-lint==26.10.1

      - name: Check vault files are encrypted
        run: |
          status=0
          for file in $(git ls-files | grep -E '(^|/)(group_vars|host_vars|inventory)/.*vault[^/]*\.ya?ml$'); do
            if ! head -n 1 "$file" | grep -q '^\$ANSIBLE_VAULT;'; then
              echo "::error file=$file::$file is not encrypted with ansible-vault"
              status=1
            fi
          done
          exit $status

      - name: Check HCP Vault secrets are written with no_log
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          import yaml


          class Loader(yaml.SafeLoader):
              pass


          # Ansible tags such as !unsafe and !vault don't matter here
          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)


          def leaf_tasks(items):
              for task in items or []:
                  if not isinstance(task, dict):
                      continue
                  if any(key in task for key in ("block", "rescue", "always")):
                      for key in ("block", "rescue", "always"):
                          yield from leaf_tasks(task.get(key))
                  else:
                      yield task


          def reads_vault(task):
              return any("hashi_vault" in key for key in task)


          failed = False
          files = subprocess.run(["git", "ls-files", "*.yml", "*.yaml"], capture_output=True, text=True, check=True).stdout.split()
          for path in files:
              text = pathlib.Path(path).read_text(errors="ignore")
              if "hashi_vault" not in text:
                  continue
              try:
                  data = yaml.load(text, Loader=Loader)
              except yaml.YAMLError:
                  continue
              if not isinstance(data, list):
                  continue
              tasks = list(leaf_tasks(data))
              secrets = {task["register"] for task in tasks if reads_vault(task) and task.get("register")}
              for task in tasks:
                  if task.get("no_log"):
                      continue
                  body = str({key: value for key, value in task.items() if key != "name"})
                  if reads_vault(task) or any(secret in body for secret in secrets):
                      name = task.get("name", "unnamed task")
                      line = next((n for n, l in enumerate(text.splitlines(), 1) if name in l), 1)
                      print(f"::error file={path},line={line}::'{name}' handles a secret from HCP Vault without no_log: true")
                      failed = True

          sys.exit(1 if failed else 0)

      - name: Check versions are pinned
        run: |
          grep -rnE "^\s*version:\s*[\"']?(latest|master|main)[\"']?\s*$" group_vars 2>/dev/null | while IFS=: read -r file line _; do
            echo "::warning file=$file,line=$line::Version is not pinned; use a release tag"
          done

      # the vault password isn't available here, so encrypted files become empty stubs for the checks below
      - name: Replace encrypted files with stubs
        run: |
          for file in $(git ls-files '*.yml' '*.yaml'); do
            if head -n 1 "$file" | grep -q '^\$ANSIBLE_VAULT;'; then
              printf -- '---\n{}\n' > "$file"
            fi
          done

      - name: Install collections and roles
        run: |
          for file in requirements.yml collections/requirements.yml roles/requirements.yml; do
            if [ -f "$file" ]; then
              ansible-galaxy install -r "$file"
            fi
          done

      - name: Syntax check playbooks
        run: |
          status=0
          for playbook in $(grep -l -E '^\s*(- )?hosts:' *.yml playbooks/*.yml 2>/dev/null); do
            if ! ansible-playbook --syntax-check -i localhost, "$playbook"; then
              echo "::error file=$playbook::Syntax check failed"
              status=1
            fi
          done
          exit $status

      - name: Run ansible-lint
        run: ansible-lint --offline

  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # pull-requests: write lets it post the coverage table on the pull request
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # scenarios on a real server need its address and key, so CI runs the container ones only
      - name: Find Molecule scenarios
        id: scenarios
        run: |
          scenarios=$(grep -l -E '^\s+name:\s+docker\s*$' molecule/*/molecule.yml 2>/dev/null | cut -d/ -f2 | xargs)
          echo "Scenarios: ${scenarios:-none, so nothing to run}"
          echo "list=$scenarios" >> "$GITHUB_OUTPUT"

      - name: Checkout ansible-ci tools
        if: steps.scenarios.outputs.list != ''
        uses: actions/checkout@v6
        with:
          repository: encapsulate-xyz/.github
          ref: ${{ inputs.ci-ref }}
          path: .ansible-ci

      - name: Set up Python
        if: steps.scenarios.outputs.list != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible and Molecule
        if: steps.scenarios.outputs.list != ''
        run: pip install ansible==11.13.0 molecule==26.10.0 "molecule-plugins[docker]==26.10.12" docker==7.2.0

      - name: Replace encrypted files with stubs
        if: steps.scenarios.outputs.list != ''
        run: |
          for file in $(git ls-files '*.yml' '*.yaml'); do
            if head -n 1 "$file" | grep -q '^\$ANSIBLE_VAULT;'; then
              printf -- '---\n{}\n' > "$file"
            fi
          done

      - name: Run Molecule scenarios
        id: molecule
        if: steps.scenarios.outputs.list != ''
        env:
          SCENARIOS: ${{ steps.scenarios.outputs.list }}
          ANSIBLE_CALLBACK_PLUGINS: ${{ github.workspace }}/.ansible-ci/ansible-ci/callback_plugins
          ANSIBLE_CALLBACKS_ENABLED: task_coverage
          TASK_COVERAGE_FILE: ${{ runner.temp }}/task-coverage.jsonl
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          for scenario in $SCENARIOS; do
            molecule test -s "$scenario"
          done

      - name: Check task coverage
        if: steps.scenarios.outputs.list != ''
        env:
          TASK_COVERAGE_REPORT: ${{ runner.temp }}/task-coverage.md
        run: python .ansible-ci/ansible-ci/check_task_coverage.py "$RUNNER_TEMP/task-coverage.jsonl" molecule/untested.yml

      # one comment per pull request, edited on every push; a failure here never fails the job
      - name: Post task coverage on the pull request
        if: always() && steps.scenarios.outputs.list != '' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MOLECULE: ${{ steps.molecule.outcome }}
        run: |
          marker='<!-- ansible-ci:task-coverage -->'
          report="$RUNNER_TEMP/task-coverage.md"
          if [ "$MOLECULE" != success ]; then
            body="## Task coverage"$'\n\n'"Molecule failed on ${SHA:0:7}, so there is no coverage for this push. See the molecule job log."
          elif [ -f "$report" ]; then
            body="$(cat "$report")"$'\n\n'"For ${SHA:0:7}."
          else
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$marker"$'\n'"$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$marker"$'\n'"$body" > /dev/null
          fi
